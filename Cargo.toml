[workspace]
resolver = "2"
members = [
    "crates/modde-core",
    "crates/modde-sources",
    "crates/modde-games",
    "crates/modde-ui",
    "crates/modde-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/rs-modde"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }

# Async
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "time"] }
futures = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3", "xxh64"] }
sha2 = "0.10"

# Small-vec inline optimization
smallvec = { version = "1", features = ["serde"] }

# Graph
petgraph = "0.8"

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
    "cookies",
] }

# Keyring
keyring = "3"

# Crypto
aes = "0.8"
ctr = "0.9"
base64 = "0.22"

# Compression
flate2 = "1"
zip = "8"

# Temp files
tempfile = "3"
pretty_assertions = "1"

# OS / system
libc = "0.2"

# Filesystem watch (inotify/kqueue)
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Git
git2 = "0.20"

# File dialog
rfd = "0.17"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# FOMOD
fomod-oxide = { path = "../rs-fomod-oxide", features = ["json"] }

# Workspace crates
modde-core = { path = "crates/modde-core" }
modde-sources = { path = "crates/modde-sources" }
modde-games = { path = "crates/modde-games" }
modde-ui = { path = "crates/modde-ui" }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
