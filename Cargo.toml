[workspace]
resolver = "2"
members = [
    "crates/modde-core",
    "crates/modde-sources",
    "crates/modde-games",
    "crates/modde-ui",
    "crates/modde-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://codeberg.org/caniko/rs-modde"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
quick-xml = { version = "0.37", features = ["serialize"] }

# Async
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Hashing
xxhash-rust = { version = "0.8", features = ["xxh3"] }
sha2 = "0.10"

# Graph
petgraph = "0.7"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

# Database
redb = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Workspace crates
modde-core = { path = "crates/modde-core" }
modde-sources = { path = "crates/modde-sources" }
modde-games = { path = "crates/modde-games" }
