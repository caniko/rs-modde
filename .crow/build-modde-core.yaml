# Generated by simit. Manual edits will be reported as ci=drift.
name: build
labels:
  agent: codefloe-global
  platform: linux/amd64
when:
- event: push
- event: pull_request
steps:
- name: cargo-fmt
  image: rust:1.93-bookworm
  commands:
  - cargo fmt --all -- --check
  environment:
    CARGO_HOME: /tmp/.cargo
- name: cargo-test
  image: rust:1.93-bookworm
  commands:
  - cargo test -p modde-core
  environment:
    CARGO_HOME: /tmp/.cargo
- name: cargo-clippy
  image: rust:1.93-bookworm
  commands:
  - cargo clippy --all-targets -- --deny warnings
  environment:
    CARGO_HOME: /tmp/.cargo
- name: cargo-package
  image: rust:1.93-bookworm
  commands:
  - cargo package --allow-dirty --list -p modde-core
  environment:
    CARGO_HOME: /tmp/.cargo
