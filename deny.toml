[advisories]
version = 2
# 2026-05-29: transitive via image/ravif and wgpu/metal; RUSTSEC states no
# safe upgrade is available, and this is unmaintained rather than vulnerable.
ignore = [{ id = "RUSTSEC-2024-0436", reason = "transitive paste usage has no fixed upstream release available" }]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "bzip2-1.0.6",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "GPL-3.0-only",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "NCSA",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  "https://codeberg.org/caniko/rs-harbor.git",
  "https://codeberg.org/caniko/rs-memory-admission.git",
]
