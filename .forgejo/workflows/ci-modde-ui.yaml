# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Check flake
        run: nix flake check

      - name: Test
        run: nix develop -c cargo test -p modde-ui

      - name: Install cargo-deny
        run: nix develop -c cargo install cargo-deny --locked

      - name: Deny dependency policy
        run: nix develop -c cargo deny check

      - name: Clippy
        run: nix develop -c cargo clippy -p modde-ui --all-targets -- --deny warnings

      - name: Package crate
        run: nix develop -c cargo package -p modde-ui --allow-dirty
