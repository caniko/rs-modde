# Generated by simit. Manual edits will be reported as ci=drift.
name: Release Artifacts

# Required release trust roots and secrets:
# - keys/maintainers.gpg: pinned maintainer OpenPGP public keys for git verify-tag.
# - keys/minisign.pub: pinned minisign public key for SHA256SUMS.txt.minisig.
# - MINISIGN_SECRET_KEY: password-protected minisign secret key for signing SHA256SUMS.txt.
# - MINISIGN_PASSWORD: password for MINISIGN_SECRET_KEY.
# - COSIGN_PRIVATE_KEY and COSIGN_PASSWORD: optional fallback when keyless Sigstore OIDC is unavailable.
on:
  push:
    tags:
      - "*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    enable-openid-connect: true
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Validate signed release tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi

          test -s keys/maintainers.gpg
          if ! command -v gpg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends gnupg
            else
              echo "gpg is required to verify signed release tags" >&2
              exit 1
            fi
          fi
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/maintainers.gpg
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"

      - name: Build package
        run: nix build

      - name: Generate signed checksums and provenance
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -d release
          test -s keys/minisign.pub
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PASSWORD:-}"

          find release -maxdepth 1 -type f ! -name 'SHA256SUMS.txt*' ! -name '*.cosign.bundle' ! -name '*.intoto.*' -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          test -s release/SHA256SUMS.txt

          umask 077
          minisign_key="$(mktemp)"
          oidc_token="$(mktemp)"
          cosign_key="$(mktemp)"
          export oidc_token cosign_key
          cleanup() { rm -f "$minisign_key" "$oidc_token" "$cosign_key"; }
          trap cleanup EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf '%s\n' "$MINISIGN_PASSWORD" |
            nix shell nixpkgs#minisign -c minisign -S \
              -s "$minisign_key" \
              -m release/SHA256SUMS.txt \
              -x release/SHA256SUMS.txt.minisig \
              -c "untrusted comment: ${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-release}}} SHA256SUMS signature"
          nix shell nixpkgs#minisign -c minisign -V \
            -m release/SHA256SUMS.txt \
            -x release/SHA256SUMS.txt.minisig \
            -p keys/minisign.pub

          nix shell nixpkgs#cosign nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"; tag="${ref#refs/tags/}"; fi
          repo_url="${GITHUB_SERVER_URL:-${FORGE_SERVER_URL:-https://codeberg.org}}/${GITHUB_REPOSITORY:-${FORGE_REPOSITORY:-${CODEBERG_REPOSITORY:-unknown/unknown}}}"
          git_sha="$(git rev-parse HEAD)"
          workflow_sha="$(sha256sum .forgejo/workflows/release-artifacts.yaml | awk '{print $1}')"
          flake_lock_sha="missing"
          if [ -f flake.lock ]; then flake_lock_sha="$(sha256sum flake.lock | awk '{print $1}')"; fi
          builder_id="${repo_url}/src/tag/${tag}/.forgejo/workflows/release-artifacts.yaml"

          sign_blob_keyless() {
            file="$1"
            if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" > "$oidc_token"
              cosign sign-blob --yes --identity-token "$oidc_token" --bundle "${file}.cosign.bundle" "$file"
            else
              return 1
            fi
          }

          attest_blob_keyless() {
            file="$1" predicate="$2"
            if [ -s "$oidc_token" ]; then
              cosign attest-blob --yes --identity-token "$oidc_token" --predicate "$predicate" --type slsaprovenance1 --output-attestation "${file}.intoto.jsonl" --bundle "${file}.intoto.bundle" "$file"
            else
              return 1
            fi
          }

          sign_blob_with_key() {
            file="$1"
            test -n "${COSIGN_PRIVATE_KEY:-}"
            printf '%s' "$COSIGN_PRIVATE_KEY" > "$cosign_key"
            cosign sign-blob --yes --key "$cosign_key" --bundle "${file}.cosign.bundle" "$file"
          }

          attest_blob_with_key() {
            file="$1" predicate="$2"
            cosign attest-blob --yes --key "$cosign_key" --predicate "$predicate" --type slsaprovenance1 --output-attestation "${file}.intoto.jsonl" --bundle "${file}.intoto.bundle" "$file"
          }

          find release -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.src.rpm' \) -print0 | sort -z | while IFS= read -r -d '' file; do
            artifact_sha="$(sha256sum "$file" | awk '{print $1}')"
            predicate="$(mktemp)"
            jq -n --arg builder_id "$builder_id" --arg git_sha "$git_sha" --arg workflow_sha "$workflow_sha" --arg flake_lock_sha "$flake_lock_sha" --arg artifact "$(basename "$file")" --arg artifact_sha "$artifact_sha" '{buildDefinition:{buildType:"https://simit.rs/release-artifacts",externalParameters:{artifact:$artifact,artifactDigest:{sha256:$artifact_sha}},internalParameters:{},resolvedDependencies:[{uri:"git",digest:{gitCommit:$git_sha}},{uri:"release-artifacts workflow",digest:{sha256:$workflow_sha}},{uri:"flake.lock",digest:{sha256:$flake_lock_sha}}]},runDetails:{builder:{id:$builder_id}}}' > "$predicate"
            if sign_blob_keyless "$file" && attest_blob_keyless "$file" "$predicate"; then
              echo "signed and attested $file with keyless Sigstore"
            elif [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then
              echo "keyless Sigstore failed for $file; using COSIGN_PRIVATE_KEY fallback"
              sign_blob_with_key "$file"
              attest_blob_with_key "$file" "$predicate"
            else
              echo "keyless Sigstore failed for $file, and COSIGN_PRIVATE_KEY is not configured" >&2
              exit 1
            fi
            rm -f "$predicate"
          done
          SCRIPT

      - name: Run release smoke checks
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          set -euo pipefail
          mkdir -p release

          if [ "${FORCE_PUBLISH:-false}" = "true" ]; then
            {
              echo "release smoke report"
              echo "force_publish: true"
              echo "smoke checks bypassed by workflow_dispatch input; external publish continued by explicit operator override"
            } | tee release/smoke-report.txt
            exit 0
          fi

          VERSION="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"; VERSION="${ref#refs/tags/}"; fi
          test -n "$VERSION"
          nix run .#release-smoke -- "$VERSION" release

      - name: Publish Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.homebrew_tap_token }}
          HOMEBREW_TAP_REPO: caniko/homebrew-modde
          HOMEBREW_TAP_URL: https://codeberg.org/caniko/homebrew-modde.git
        run: |
          set -euo pipefail

          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not configured; skipping Homebrew tap update."
            exit 0
          fi

          VERSION="$CODEBERG_REF_NAME"
          for artifact in \
            "release/modde-${VERSION}-aarch64-darwin.tar.gz" \
            "release/modde-${VERSION}-x86_64-darwin.tar.gz" \
            "release/modde-${VERSION}-aarch64-linux.tar.gz" \
            "release/modde-${VERSION}-x86_64-linux.tar.gz"; do
            test -s "$artifact"
          done

          credential_helper='!f() { echo username=caniko; echo "password=$HOMEBREW_TAP_TOKEN"; }; f'
          rm -rf tap
          git -c credential.helper="$credential_helper" clone "$HOMEBREW_TAP_URL" tap
          cd tap
          git config credential.helper "$credential_helper"
          git config user.email 'ci@modde.tartanoglu.com'
          git config user.name 'modde release bot'
          git remote set-head origin -a
          DEFAULT_BRANCH="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')"
          git checkout "$DEFAULT_BRANCH"
          cd ..

          nix run '.#rs-harbor' -- brew bump \
            --name modde \
            --version "$VERSION" \
            --description 'Cross-platform game mod manager' \
            --homepage 'https://modde.tartanoglu.com' \
            --license GPL-3.0-only \
            --archive "darwin_arm=https://codeberg.org/caniko/rs-modde/releases/download/${VERSION}/modde-${VERSION}-aarch64-darwin.tar.gz,release/modde-${VERSION}-aarch64-darwin.tar.gz" \
            --archive "darwin_intel=https://codeberg.org/caniko/rs-modde/releases/download/${VERSION}/modde-${VERSION}-x86_64-darwin.tar.gz,release/modde-${VERSION}-x86_64-darwin.tar.gz" \
            --archive "linux_arm=https://codeberg.org/caniko/rs-modde/releases/download/${VERSION}/modde-${VERSION}-aarch64-linux.tar.gz,release/modde-${VERSION}-aarch64-linux.tar.gz" \
            --archive "linux_intel=https://codeberg.org/caniko/rs-modde/releases/download/${VERSION}/modde-${VERSION}-x86_64-linux.tar.gz,release/modde-${VERSION}-x86_64-linux.tar.gz" \
            --binary modde \
            --binary modde-ui \
            --tap "$PWD/tap"

          cd tap
          if [ -z "$(git status --porcelain -- Formula/modde.rb)" ]; then
            echo "tap already contains modde ${VERSION}; nothing to push"
            exit 0
          fi

          git add Formula/modde.rb
          git commit -m "modde ${VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
