          sed -e "s|{{VERSION}}|${VERSION}|g" -e "s|{{SHA256}}|${SHA256}|g" dist/scoop/modde.json > scoop-bucket/bucket/modde.json
          cd scoop-bucket; if [ -z "$(git status --porcelain -- bucket/modde.json)" ]; then echo 'bucket unchanged'; exit 0; fi
