---
# yamllint disable rule:line-length
name: release

"on":
  push:
    tags:
      - "[0-9]*"

concurrency:
  group: ${{ codeberg.workflow }}-${{ codeberg.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: atlas
    container: debian:bookworm
    enable-openid-connect: true
    steps:
      - name: Checkout tag
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git dpkg-dev reprepro gnupg openssh-client sed findutils

          VERSION="${CODEBERG_REF_NAME:-${GITHUB_REF_NAME:-${FORGE_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then
            ref="${CODEBERG_REF:-${GITHUB_REF:-${FORGE_REF:-}}}"
            VERSION="${ref#refs/tags/}"
          fi
          git init .
          git remote add origin https://codeberg.org/caniko/rs-modde.git
          git fetch --depth 1 origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          git checkout --detach "refs/tags/${VERSION}"

      - name: Validate tag
        run: |
          set -euo pipefail
          VERSION="${CODEBERG_REF_NAME:-${GITHUB_REF_NAME:-${FORGE_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then
            ref="${CODEBERG_REF:-${GITHUB_REF:-${FORGE_REF:-}}}"
            VERSION="${ref#refs/tags/}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $VERSION" >&2
            exit 1
          fi

          in_workspace_package=false
          cargo_version=""
          while IFS= read -r line; do
            if [ "$line" = "[workspace.package]" ]; then
              in_workspace_package=true
              continue
            fi
            if [[ "$line" == \[*\] ]] && [ "$line" != "[workspace.package]" ]; then
              in_workspace_package=false
            fi
            if [ "$in_workspace_package" = "true" ] && [[ "$line" =~ ^version[[:space:]]*=[[:space:]]*\"([^\"]+)\" ]]; then
              cargo_version="${BASH_REMATCH[1]}"
              break
            fi
          done < Cargo.toml
          test "$cargo_version" = "$VERSION"

          changelog_found=false
          while IFS= read -r line; do
            if [[ "$line" =~ ^##\ \[$VERSION\]\ -\ [0-9]{4}-[0-9]{2}-[0-9]{2} ]]; then
              changelog_found=true
              break
            fi
          done < CHANGELOG.md
          if [ "$changelog_found" != "true" ]; then
            echo "CHANGELOG.md missing section for $VERSION; expected '## [$VERSION] - YYYY-MM-DD'" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if [[ "$VERSION" =~ -(rc|beta|alpha)\.[0-9]+$ ]]; then
            IS_PRERELEASE=true
          fi
          {
            printf 'VERSION=%s\n' "$VERSION"
            printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"
          } > release-env

      - name: Build Debian packages
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Prerelease ${VERSION}; skipping Debian package build."
            exit 0
          fi

          mkdir -p release
          make_deb() {
            package="$1"
            binary="$2"
            root="pkg-${package}"
            rm -rf "$root"
            mkdir -p "$root/DEBIAN" "$root/usr/bin"
            {
              printf 'Package: %s\n' "$package"
              printf 'Version: %s\n' "$VERSION"
              printf 'Section: utils\n'
              printf 'Priority: optional\n'
              printf 'Architecture: amd64\n'
              printf 'Maintainer: modde release bot <release-bot@modde.tartanoglu.com>\n'
              printf 'Description: Phase 05 APT smoke package for %s\n' "$package"
            } > "$root/DEBIAN/control"
            {
              printf '#!/bin/sh\n'
              printf "printf '%%s %%s\\\\n' '%s' '%s'\n" "$binary" "$VERSION"
            } > "$root/usr/bin/${binary}"
            chmod 755 "$root/usr/bin/${binary}"
            dpkg-deb --build "$root" "release/${package}_${VERSION}_amd64.deb"
          }

          make_deb modde modde
          make_deb modde-ui modde-ui
          test -s "release/modde_${VERSION}_amd64.deb"
          test -s "release/modde-ui_${VERSION}_amd64.deb"
          ls -l release/*.deb

      - name: Publish APT repository
        env:
          APT_REPO_GPG_KEY: ${{ secrets.modde_apt_repo_gpg_key }}
          APT_REPO_GPG_KEY_ID: ${{ secrets.modde_apt_repo_gpg_key_id }}
          APT_REPO_GPG_PASSPHRASE: ${{ secrets.modde_apt_repo_gpg_passphrase }}
          APT_REPO_SSH_KEY: ${{ secrets.modde_apt_repo_ssh_key }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Prerelease ${VERSION}; skipping APT repository publish."
            exit 0
          fi

          export VERSION
          bash scripts/publish-apt.sh
