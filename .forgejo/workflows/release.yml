          cd tap; git config credential.helper "$credential_helper"; git config user.email 'ci@localhost'; git config user.name 'release bot'
          git remote set-head origin -a; DEFAULT_BRANCH="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')"; git checkout "$DEFAULT_BRANCH"; cd ..
          nix run '.#rs-harbor' -- brew bump \
            --name modde \
