---
# yamllint disable rule:line-length
# Generated by simit. Manual edits will be reported as ci=drift.
# Required secrets and variables:
# - CODEBERG_TOKEN: Codeberg API token for release creation and asset upload.
# - MINISIGN_SECRET_KEY, MINISIGN_PASSWORD: minisign signing of SHA256SUMS.txt.
# - COSIGN_PRIVATE_KEY, COSIGN_PASSWORD: optional fallback when keyless Sigstore OIDC is unavailable.
# - MODDE_APT_REPO_GPG_KEY: armored GPG private key for the apt repository.
# - vars.MODDE_APT_REPO_GPG_KEY_ID: fingerprint for the apt repository signing key.
# - MODDE_APT_REPO_GPG_PASSPHRASE: optional passphrase for the apt signing key.
# - MODDE_APT_REPO_SSH_KEY: ed25519 deploy key that pushes the apt tree.
# - AUR_SSH_KEY: Ed25519 private key for aur.archlinux.org pushes.
# - COPR_LOGIN, COPR_USERNAME, COPR_TOKEN: COPR upload credentials; COPR_USERNAME is an Actions variable.
# - WINDOWS_SIGNING_PFX, WINDOWS_SIGNING_PASS: optional Authenticode PKCS#12 cert + passphrase.
# - CHOCOLATEY_API_KEY: optional Chocolatey push API key (env CHOCOLATEY_API_KEY).
# - FLATHUB_TOKEN: optional GitHub PAT for flathub/com.tartanoglu.modde Flathub PRs.
# - WINGET_PAT: optional GitHub PAT for winget-pkgs PRs.
# - MASTODON_TOKEN, MASTODON_BASE_URL, MATRIX_TOKEN, MATRIX_HOMESERVER, MATRIX_ROOM: optional release announcement credentials.
# Runner credential: $ATTIC_TOKENS_DIR/rs-modde: Attic token file.

name: release

'on':
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to build without moving the tag.'
        required: false
        default: ''
        type: string
      force_publish:
        description: 'Bypass release smoke checks and continue to publish.'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: atlas-nix-trusted
    enable-openid-connect: true
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        accept-flake-config = true
        substituters = https://attic.candee.baby/canix https://cache.nixos.org
        trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      XDG_CACHE_HOME: "/tmp/.cache"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"; fi
          if [ -z "$VERSION" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"; VERSION="${ref#refs/tags/}"; fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'
          git fetch --force --tags origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
          tag_worktree="$(mktemp -d)"
          rmdir "$tag_worktree"
          cleanup_validation() {
            if [ -n "${tag_worktree:-}" ]; then git worktree remove --force "$tag_worktree" >/dev/null 2>&1 || rm -rf "$tag_worktree"; fi
            if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup_validation EXIT
          git worktree add --detach "$tag_worktree" "$VERSION"
          test "$(nix eval --raw "$tag_worktree#modde.version")" = "$VERSION"
          test -s "$tag_worktree/keys/maintainers.gpg"
          if ! grep -q "^## \[$VERSION\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]" "$tag_worktree/CHANGELOG.md"; then
            echo "CHANGELOG.md missing section for $VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s\n' "$VERSION" | grep -Eq -- '-(rc|beta|alpha)\.[0-9]+$'; then IS_PRERELEASE=true; fi

          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          gpg --batch --import "$tag_worktree/keys/maintainers.gpg"
          git verify-tag "$VERSION"
          validated_sha="$(git -C "$tag_worktree" rev-parse HEAD)"
          git checkout --detach "$validated_sha"
          { printf 'VERSION=%s\n' "$VERSION"; printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"; } > release-env
      - name: Check release credentials
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          . ./release-env
          missing=''
          require_credential() {
            scope="$1"; name="$2"; value="$3"
            if [ -z "$value" ]; then missing="$(printf '%s\n  - %s %s' "$missing" "$scope" "$name")"; fi
          }
          require_credential 'global/user secret' 'CODEBERG_TOKEN' "${CODEBERG_TOKEN:-}"
          require_credential 'repo secret' 'MINISIGN_SECRET_KEY' "${MINISIGN_SECRET_KEY:-}"
          require_credential 'repo secret' 'MINISIGN_PASSWORD' "${MINISIGN_PASSWORD:-}"
          if [ -n "$missing" ]; then
            printf 'Missing release credentials:%s\n' "$missing" >&2
            exit 1
          fi
          test -s keys/minisign.pub
          umask 077
          minisign_key="$(mktemp)"; minisign_probe="$(mktemp)"; minisign_sig="${minisign_probe}.minisig"
          trap 'rm -f "$minisign_key" "$minisign_probe" "$minisign_sig"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf 'simit release credentials probe\n' > "$minisign_probe"
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix shell nixpkgs#minisign -c minisign -S -s "$minisign_key" -m "$minisign_probe" -x "$minisign_sig"
          nix shell nixpkgs#minisign -c minisign -V -m "$minisign_probe" -x "$minisign_sig" -p keys/minisign.pub
      - name: Rewrite dist/rpm/modde.spec Version
        run: |
          . ./release-env
          sed -i "0,/^Version:.*$/s//Version:        ${VERSION}/" dist/rpm/modde.spec
          grep '^Version:' dist/rpm/modde.spec
      - name: Check supply-chain policy
        run: |
          nix shell nixpkgs#cargo nixpkgs#rustc nixpkgs#cargo-deny -c cargo deny check -D vulnerability -W unmaintained advisories bans sources licenses
      - name: Build SRPM for COPR
        run: |
          set -euo pipefail
          . ./release-env
          git archive --format=tar.gz --prefix=rs-modde/ -o "rs-modde-${VERSION}.tar.gz" HEAD
          nix shell nixpkgs#rpm nixpkgs#cargo nixpkgs#rustc -c bash <<'SCRIPT'
          set -euo pipefail
          tar xf rs-modde-*.tar.gz
          ( cd rs-modde && cargo vendor vendor > ../cargo-vendor-config.toml )
          tar czf vendor.tar.gz -C rs-modde vendor
          rm -rf target/modde-release/root-artifacts/srpms && mkdir -p target/modde-release/root-artifacts/srpms
          rpmbuild -bs dist/rpm/modde.spec --define "_sourcedir $(pwd)" --define "_srcrpmdir $(pwd)/target/modde-release/root-artifacts/srpms"
          set -- target/modde-release/root-artifacts/srpms/*.src.rpm; test "$#" -eq 1; ls -l "$1"
          SCRIPT
      - name: Generate supply-chain reports
        run: |
          set -euo pipefail
          . ./release-env
          export VERSION IS_PRERELEASE
          mkdir -p release
          nix develop -c bash <<'SBOM'
          set -euo pipefail
          cargo about generate --config dist/licenses/about.toml --output-file target/modde-release/root-artifacts/release/THIRD_PARTY_LICENSES.html dist/licenses/about-template.hbs
          cargo sbom --output-format cyclone_dx_json_1_5 > "target/modde-release/root-artifacts/release/modde-${VERSION}.cdx.json"
          cargo sbom --output-format spdx_json_2_3 > "target/modde-release/root-artifacts/release/modde-${VERSION}.spdx.json"
          SBOM
          
      - name: Build release artifacts
        run: |
          set -euo pipefail
          . ./release-env
          export VERSION IS_PRERELEASE
          mkdir -p release
          copy_nix_binary() {
            result_dir="$1"; binary="$2"; destination="$3"
            if [ -f "${result_dir}/bin/.${binary}-wrapped" ]; then cp "${result_dir}/bin/.${binary}-wrapped" "$destination"; else cp "${result_dir}/bin/${binary}" "$destination"; fi
          }
          
          nix build .#modde --out-link target/modde-release/root-artifacts/linux-result
          mkdir -p target/modde-release/root-artifacts/release/linux-x86_64
          copy_nix_binary target/modde-release/root-artifacts/linux-result modde target/modde-release/root-artifacts/release/linux-x86_64/modde
          copy_nix_binary target/modde-release/root-artifacts/linux-result modde-ui target/modde-release/root-artifacts/release/linux-x86_64/modde-ui
          tar czf "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64-linux.tar.gz" -C target/modde-release/root-artifacts/release/linux-x86_64 modde modde-ui
          cp target/modde-release/root-artifacts/release/linux-x86_64/modde "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64-linux"
          cp target/modde-release/root-artifacts/release/linux-x86_64/modde-ui "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-x86_64-linux"
          
          nix build .#modde-aarch64-linux --out-link target/modde-release/root-artifacts/aarch64-linux-result
          mkdir -p target/modde-release/root-artifacts/release/linux-aarch64
          copy_nix_binary target/modde-release/root-artifacts/aarch64-linux-result modde target/modde-release/root-artifacts/release/linux-aarch64/modde
          copy_nix_binary target/modde-release/root-artifacts/aarch64-linux-result modde-ui target/modde-release/root-artifacts/release/linux-aarch64/modde-ui
          tar czf "target/modde-release/root-artifacts/release/modde-${VERSION}-aarch64-linux.tar.gz" -C target/modde-release/root-artifacts/release/linux-aarch64 modde modde-ui
          cp target/modde-release/root-artifacts/release/linux-aarch64/modde "target/modde-release/root-artifacts/release/modde-${VERSION}-aarch64-linux"
          cp target/modde-release/root-artifacts/release/linux-aarch64/modde-ui "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-aarch64-linux"
          
          nix build .#modde-windows --out-link target/modde-release/root-artifacts/windows-result
          mkdir -p target/modde-release/root-artifacts/release/windows-x86_64
          cp target/modde-release/root-artifacts/windows-result/bin/modde.exe target/modde-release/root-artifacts/windows-result/bin/modde-ui.exe target/modde-release/root-artifacts/release/windows-x86_64/
          if [ -f target/modde-release/root-artifacts/windows-result/bin/libmcfgthread-2.dll ]; then cp target/modde-release/root-artifacts/windows-result/bin/libmcfgthread-2.dll target/modde-release/root-artifacts/release/windows-x86_64/; fi
          # Windows tar.gz/zip and individual signed .exe assets are produced
          # by the Authenticode signing step, after the .exe files are signed.
          
          nix build .#modde-darwin-x86_64 --out-link target/modde-release/root-artifacts/darwin-x86-result
          mkdir -p target/modde-release/root-artifacts/release/darwin-x86_64
          cp target/modde-release/root-artifacts/darwin-x86-result/bin/modde target/modde-release/root-artifacts/darwin-x86-result/bin/modde-ui target/modde-release/root-artifacts/release/darwin-x86_64/
          tar czf "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64-darwin.tar.gz" -C target/modde-release/root-artifacts/release/darwin-x86_64 modde modde-ui
          
          nix build .#modde-darwin-aarch64 --out-link target/modde-release/root-artifacts/darwin-arm-result
          mkdir -p target/modde-release/root-artifacts/release/darwin-aarch64
          cp target/modde-release/root-artifacts/darwin-arm-result/bin/modde target/modde-release/root-artifacts/darwin-arm-result/bin/modde-ui target/modde-release/root-artifacts/release/darwin-aarch64/
          tar czf "target/modde-release/root-artifacts/release/modde-${VERSION}-aarch64-darwin.tar.gz" -C target/modde-release/root-artifacts/release/darwin-aarch64 modde modde-ui
          
          nix build .#appimage-ui --out-link target/modde-release/root-artifacts/appimage-ui-result
          cp target/modde-release/root-artifacts/appimage-ui-result "target/modde-release/root-artifacts/release/modde-ui-${VERSION}-x86_64.AppImage"
          nix build .#appimage-cli --out-link target/modde-release/root-artifacts/appimage-cli-result
          cp target/modde-release/root-artifacts/appimage-cli-result "target/modde-release/root-artifacts/release/modde-${VERSION}-x86_64.AppImage"
          
          git archive --format=tar.gz --prefix=rs-modde/ -o "target/modde-release/root-artifacts/release/rs-modde-${VERSION}.tar.gz" HEAD
          source_sha256="$(sha256sum "target/modde-release/root-artifacts/release/rs-modde-${VERSION}.tar.gz" | awk '{print $1}')"
          nix build .#flatpak-manifest --out-link target/modde-release/root-artifacts/flatpak-result
          cp target/modde-release/root-artifacts/flatpak-result target/modde-release/root-artifacts/release/com.tartanoglu.modde.json
          sed -i "s/@SOURCE_TARBALL_SHA256@/${source_sha256}/" target/modde-release/root-artifacts/release/com.tartanoglu.modde.json
          nix run .#flatpak-cargo-generator -- Cargo.lock -o target/modde-release/root-artifacts/release/cargo-sources.json
          cp target/modde-release/root-artifacts/srpms/*.src.rpm target/modde-release/root-artifacts/release/ 2>/dev/null || true
          
      - name: Build Debian packages
        run: |
          set -euo pipefail
          . ./release-env
          export VERSION IS_PRERELEASE
          mkdir -p release
          if ! nix develop -c bash scripts/build-deb.sh "$VERSION" release
          then
            echo "::warning::Debian package build failed; continuing without .deb release assets and APT publish."
          fi
      - name: Sign Windows Authenticode artifacts
        env:
          WINDOWS_SIGNING_PFX: ${{ secrets.WINDOWS_SIGNING_PFX }}
          WINDOWS_SIGNING_PASS: ${{ secrets.WINDOWS_SIGNING_PASS }}
          WINDOWS_SIGNING_SUBJECT: ${{ secrets.WINDOWS_SIGNING_SUBJECT }}
        run: |
          set -euo pipefail
          . ./release-env
          for exe in release/windows-x86_64/modde.exe release/windows-x86_64/modde-ui.exe; do test -s "$exe"; done
          if [ -n "${WINDOWS_SIGNING_PFX:-}" ] && [ -n "${WINDOWS_SIGNING_PASS:-}" ]; then
            nix shell nixpkgs#osslsigncode nixpkgs#openssl -c bash <<'SCRIPT'
          set -euo pipefail
          umask 077
          pfx_file="$(mktemp)"; pass_file="$(mktemp)"
          trap 'rm -f "$pfx_file" "$pass_file"' EXIT
          printf '%s' "$WINDOWS_SIGNING_PFX" | base64 --decode > "$pfx_file"
          printf '%s' "$WINDOWS_SIGNING_PASS" > "$pass_file"
          for exe in release/windows-x86_64/modde.exe release/windows-x86_64/modde-ui.exe; do
            osslsigncode sign -pkcs12 "$pfx_file" -readpass "$pass_file" -h sha256 \
              -n 'modde' -i 'https://modde.tartanoglu.com' -ts 'http://timestamp.digicert.com' \
              -in "$exe" -out "${exe}.signed"
            osslsigncode verify -in "${exe}.signed"
            mv "${exe}.signed" "$exe"
          done
          SCRIPT
          else
            echo '::warning::WINDOWS_SIGNING_PFX/PASS unset; publishing unsigned Windows EXEs.'
          fi
          tar czf "release/modde-${VERSION}-x86_64-windows.tar.gz" -C release/windows-x86_64 modde.exe modde-ui.exe
          zip_out="$PWD/release/modde-${VERSION}-x86_64-windows.zip"
          nix shell nixpkgs#zip -c bash -c 'cd "$1" && shift && zip -q "$1" "$@"' _ release/windows-x86_64 "$zip_out" modde.exe modde-ui.exe
          cp release/windows-x86_64/modde.exe "release/modde-${VERSION}-x86_64-windows.exe"
          cp release/windows-x86_64/modde-ui.exe "release/modde-ui-${VERSION}-x86_64-windows.exe"
      - name: Generate release checksums
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=()
          add_matches() { local pattern="$1" match; while IFS= read -r match; do files+=("$match"); done < <(compgen -G "$pattern" || true); }
          add_matches '*.tar.gz'
          add_matches '*.zip'
          add_matches '*.AppImage'
          add_matches '*.deb'
          add_matches '*.src.rpm'
          add_matches '*.cdx.json'
          add_matches '*.spdx.json'
          : > SHA256SUMS.txt
          count=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            [ "$file" != SHA256SUMS.txt ] || continue
            sha256sum "$file" >> SHA256SUMS.txt
            count=$((count + 1))
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          test "$count" -gt 0
          test -s SHA256SUMS.txt
      - name: Sign checksums and attest release artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          . ./release-env
          test -s keys/minisign.pub
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PASSWORD:-}"
          umask 077
          minisign_key="$(mktemp)"; oidc_token="$(mktemp)"; cosign_key="$(mktemp)"; export oidc_token cosign_key
          trap 'rm -f "$minisign_key" "$oidc_token" "$cosign_key"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix shell nixpkgs#minisign -c minisign -S -s "$minisign_key" -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig
          nix shell nixpkgs#minisign -c minisign -V -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig -p keys/minisign.pub

          nix shell nixpkgs#cosign nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          repo_url="https://codeberg.org/caniko/rs-modde"
          git_sha="$(git rev-parse HEAD)"
          workflow_sha="$(sha256sum .forgejo/workflows/release.yml | awk '{print $1}')"
          flake_lock_sha="missing"; if [ -f flake.lock ]; then flake_lock_sha="$(sha256sum flake.lock | awk '{print $1}')"; fi
          builder_id="${repo_url}/src/tag/${VERSION}/.forgejo/workflows/release.yml"
          sign_blob_keyless() { file="$1"; if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" > "$oidc_token"; cosign sign-blob --yes --identity-token "$oidc_token" --bundle "${file}.cosign.bundle" "$file"; else return 1; fi; }
          attest_blob_keyless() { file="$1"; predicate="$2"; if [ -s "$oidc_token" ]; then cosign attest-blob --yes --identity-token "$oidc_token" --predicate "$predicate" --type slsaprovenance1 --output-attestation "${file}.intoto.jsonl" --bundle "${file}.intoto.bundle" "$file"; else return 1; fi; }
          sign_blob_with_key() { file="$1"; test -n "${COSIGN_PRIVATE_KEY:-}"; printf '%s' "$COSIGN_PRIVATE_KEY" > "$cosign_key"; cosign sign-blob --yes --key "$cosign_key" --bundle "${file}.cosign.bundle" "$file"; }
          attest_blob_with_key() { file="$1"; predicate="$2"; cosign attest-blob --yes --key "$cosign_key" --predicate "$predicate" --type slsaprovenance1 --output-attestation "${file}.intoto.jsonl" --bundle "${file}.intoto.bundle" "$file"; }
          shopt -s nullglob
          files=(release/*.tar.gz release/*.zip release/*.AppImage release/*.deb release/*.src.rpm release/*.exe)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            artifact_sha="$(sha256sum "$file" | awk '{print $1}')"; predicate="$(mktemp)"
            jq -n --arg builder_id "$builder_id" --arg git_sha "$git_sha" --arg workflow_sha "$workflow_sha" --arg flake_lock_sha "$flake_lock_sha" --arg repo_url "$repo_url" --arg ref "refs/tags/${VERSION}" --arg artifact "$(basename "$file")" --arg artifact_sha "$artifact_sha" '{buildDefinition:{buildType:"https://simit.rs/release",externalParameters:{repository:$repo_url,ref:$ref,artifact:$artifact,artifactDigest:{sha256:$artifact_sha}},internalParameters:{},resolvedDependencies:[{uri:($repo_url+".git"),digest:{gitCommit:$git_sha}},{uri:"flake.lock",digest:{sha256:$flake_lock_sha}},{uri:"release workflow",digest:{sha256:$workflow_sha}}]},runDetails:{builder:{id:$builder_id}}}' > "$predicate"
            if sign_blob_keyless "$file" && attest_blob_keyless "$file" "$predicate"; then echo "signed+attested $file (keyless)"; elif [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then echo "keyless failed for $file; using COSIGN_PRIVATE_KEY"; sign_blob_with_key "$file"; attest_blob_with_key "$file" "$predicate"; else echo "::warning::keyless Sigstore failed and COSIGN_PRIVATE_KEY unset; continuing without cosign signature or attestation for $file" >&2; fi
            rm -f "$predicate"
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          SCRIPT
      - name: Run release smoke checks
        env:
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          set -euo pipefail
          . ./release-env
          mkdir -p release
          if [ "${FORCE_PUBLISH:-false}" = "true" ]; then echo "smoke bypassed" | tee release/smoke-report.txt; exit 0; fi
          nix run .#release-smoke -- "$VERSION" release
      - name: Publish Codeberg release
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_API: https://codeberg.org/api/v1
          CODEBERG_REPO: caniko/rs-modde
        run: |
          set -euo pipefail
          test -n "$CODEBERG_TOKEN"
          . ./release-env
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          release_payload=$(jq -n --arg tag "$VERSION" --arg name "$VERSION" --arg branch "trunk" --argjson prerelease "$IS_PRERELEASE" --rawfile body CHANGELOG.md '{tag_name: $tag, target_commitish: $branch, name: $name, body: $body, draft: false, prerelease: $prerelease}')
          status=$(curl -sS -o release.json -w '%{http_code}' -H "Authorization: token ${CODEBERG_TOKEN}" -H 'Content-Type: application/json' -d "$release_payload" "${CODEBERG_API}/repos/${CODEBERG_REPO}/releases")
          if [ "$status" = "409" ]; then
            curl -sS --fail -H "Authorization: token ${CODEBERG_TOKEN}" "${CODEBERG_API}/repos/${CODEBERG_REPO}/releases/tags/${VERSION}" > release.json
          elif [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat release.json; exit 1; fi
          release_id="$(jq -r '.id' release.json)"; test "$release_id" != "null"
          shopt -s nullglob
          files=(release/*)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            asset_id="$(curl -sS --fail -H "Authorization: token ${CODEBERG_TOKEN}" "${CODEBERG_API}/repos/${CODEBERG_REPO}/releases/${release_id}/assets" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -n 1)"
            if [ -n "$asset_id" ]; then curl -sS --fail -X DELETE -H "Authorization: token ${CODEBERG_TOKEN}" "${CODEBERG_API}/repos/${CODEBERG_REPO}/releases/${release_id}/assets/${asset_id}"; fi
            curl -sS --fail -H "Authorization: token ${CODEBERG_TOKEN}" -H 'Content-Type: application/octet-stream' --data-binary "@${file}" "${CODEBERG_API}/repos/${CODEBERG_REPO}/releases/${release_id}/assets?name=${name}" > /dev/null
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          SCRIPT
      - name: Push Nix closures to Attic
        run: |
          set -euo pipefail
          attic_token_dir="${ATTIC_TOKENS_DIR:-}"
          attic_token="${attic_token_dir}/rs-modde"
          if [ -z "$attic_token_dir" ] || [ ! -r "$attic_token" ]; then
            echo "::warning::Attic token ${ATTIC_TOKENS_DIR:-<unset>}/rs-modde is not readable; skipping optional Nix closure cache push."
            exit 0
          fi
          nix path-info -r \
            ./target/modde-release/root-artifacts/linux-result \
            ./target/modde-release/root-artifacts/aarch64-linux-result \
            ./target/modde-release/root-artifacts/windows-result \
            ./target/modde-release/root-artifacts/darwin-x86-result \
            ./target/modde-release/root-artifacts/darwin-arm-result \
            ./target/modde-release/root-artifacts/appimage-ui-result \
            ./target/modde-release/root-artifacts/appimage-cli-result \
            ./target/modde-release/root-artifacts/flatpak-result \
            > attic-paths.txt
          nix profile install nixpkgs#attic-client
          if ! attic login canix https://attic.candee.baby "$(cat "$attic_token")"; then
            echo "::warning::Attic login failed; skipping optional Nix closure cache push."
            exit 0
          fi
          if ! attic push canix $(cat attic-paths.txt); then
            echo "::warning::Attic push failed; continuing release without optional Nix closure cache push."
            exit 0
          fi
      - name: Probe downstream publisher state
        run: |
          set -euo pipefail
          . ./release-env
          : > release-publisher-state.env
          write_state() {
            channel="$1"; state="$2"; detail="$3"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            printf '%s=%s\n' "$var" "$state" >> release-publisher-state.env
            printf '%-10s %s %s\n' "$channel" "$state" "$detail"
          }
          public_git_url() {
            case "$1" in
              ssh://git@codeberg.org/*) path="${1#ssh://git@codeberg.org/}"; printf 'https://codeberg.org/%s\n' "$path" ;;
              git@codeberg.org:*) path="${1#git@codeberg.org:}"; printf 'https://codeberg.org/%s\n' "$path" ;;
              *) printf '%s\n' "$1" ;;
            esac
          }
          probe_git_file() {
            repo="$1"; ref="$2"; path="$3"
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            git clone --depth 1 --branch "$ref" "$(public_git_url "$repo")" "$tmp/repo" >/dev/null 2>&1 && test -e "$tmp/repo/$path"
          }
          probe_git_tree() {
            repo="$1"; ref="$2"; path_a="$3"; path_b="$4"; tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            git clone --depth 1 --branch "$ref" "$(public_git_url "$repo")" "$tmp/repo" >/dev/null 2>&1 && test -e "$tmp/repo/$path_a" && test -e "$tmp/repo/$path_b"
          }
          active_or_soft() {
            channel="$1"; detail="$2"; shift 2
            if "$@"; then write_state "$channel" active-required "$detail"; else write_state "$channel" inactive-soft "$detail"; fi
          }
          stable_or_state() {
            channel="$1"; detail="$2"; shift 2
            if [ "$IS_PRERELEASE" = "true" ]; then write_state "$channel" skipped-prerelease "$detail"; else active_or_soft "$channel" "$detail" "$@"; fi
          }
          stable_or_state apt 'ssh://git@codeberg.org/caniko/apt-modde.git pages' probe_git_tree 'ssh://git@codeberg.org/caniko/apt-modde.git' 'pages' dists pool
          stable_or_state aur 'modde' bash -c 'git ls-remote --exit-code '\''https://aur.archlinux.org/modde.git'\'' HEAD >/dev/null 2>&1 && git ls-remote --exit-code '\''https://aur.archlinux.org/modde-bin.git'\'' HEAD >/dev/null 2>&1 && git ls-remote --exit-code '\''https://aur.archlinux.org/modde-git.git'\'' HEAD >/dev/null 2>&1'
          COPR_PROBE_PROJECT='caniko/rs-modde'
          if [ "$IS_PRERELEASE" = "true" ]; then COPR_PROBE_PROJECT='caniko/rs-modde-testing'; fi
          active_or_soft copr "$COPR_PROBE_PROJECT" curl -fsSL "https://copr.fedorainfracloud.org/coprs/${COPR_PROBE_PROJECT}/"
          export CHOCO_FILTER="$(printf 'Id eq '\''modde'\'' and IsLatestVersion' | jq -sRr @uri)"
          stable_or_state chocolatey 'modde' bash -c 'curl -fsSL "https://community.chocolatey.org/api/v2/Packages()?%24filter=${CHOCO_FILTER}" | grep -q "<entry>"'
          stable_or_state homebrew 'https://codeberg.org/caniko/homebrew-modde.git' probe_git_file 'https://codeberg.org/caniko/homebrew-modde.git' HEAD 'Formula/modde.rb'
          stable_or_state scoop 'https://codeberg.org/caniko/scoop-modde.git' probe_git_file 'https://codeberg.org/caniko/scoop-modde.git' HEAD 'bucket/modde.json'
          stable_or_state flathub 'flathub/com.tartanoglu.modde' curl -fsSL 'https://api.github.com/repos/flathub/com.tartanoglu.modde'
          stable_or_state winget 'Caniko.Modde' curl -fsSL 'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/c/Caniko/Modde'
      - name: Publish APT repository
        env:
          APT_REPO_GPG_KEY: ${{ secrets.MODDE_APT_REPO_GPG_KEY }}
          APT_REPO_GPG_KEY_ID: ${{ vars.MODDE_APT_REPO_GPG_KEY_ID }}
          APT_REPO_GPG_PASSPHRASE: ${{ secrets.MODDE_APT_REPO_GPG_PASSPHRASE }}
          APT_REPO_SSH_KEY: ${{ secrets.MODDE_APT_REPO_SSH_KEY }}
          APT_REPO_REMOTE: ssh://git@codeberg.org/caniko/apt-modde.git
          APT_REPO_BRANCH: pages
          APT_DISTRIBUTION: stable
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping APT repository publish."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            if [ "$state" = active-required ]; then echo "::error::${channel}: ${message}" >&2; exit 1; fi
            echo "::warning::${channel}: ${message}; bootstrap channel is inactive, skipping." >&2
            exit 0
          }
          if [ -z "${APT_REPO_GPG_KEY:-}" ] || [ -z "${APT_REPO_GPG_KEY_ID:-}" ] || [ -z "${APT_REPO_SSH_KEY:-}" ]; then publisher_missing apt 'apt secrets unset'; fi
          debs=(release/*.deb); if [ ! -e "${debs[0]}" ]; then publisher_missing apt 'no .deb to publish'; fi
          nix shell nixpkgs#reprepro nixpkgs#gnupg nixpkgs#openssh nixpkgs#git -c bash <<'SCRIPT'
          set -euo pipefail
          work="$(mktemp -d)"; chmod 700 "$work"
          trap 'rm -rf "$work"; [ -n "${SSH_AGENT_PID:-}" ] && ssh-agent -k >/dev/null 2>&1 || true' EXIT
          export GNUPGHOME="$work/gpg"; mkdir -p "$GNUPGHOME"; chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_REPO_GPG_KEY" | gpg --batch --import
          echo "${APT_REPO_GPG_KEY_ID}:6:" | gpg --batch --import-ownertrust
          eval "$(ssh-agent -s)"; ssh_key="$work/id"; printf '%s\n' "$APT_REPO_SSH_KEY" > "$ssh_key"; chmod 600 "$ssh_key"; ssh-add "$ssh_key"
          ssh_known="$work/known_hosts"; ssh-keyscan codeberg.org > "$ssh_known" 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i $ssh_key -o IdentitiesOnly=yes -o UserKnownHostsFile=$ssh_known -o StrictHostKeyChecking=yes"
          mkdir -p "$work/apt/conf"; cp dist/apt/conf/distributions "$work/apt/conf/distributions"
          for deb in release/*.deb; do reprepro -b "$work/apt" includedeb "$APT_DISTRIBUTION" "$deb"; done
          git clone --depth 1 --branch "$APT_REPO_BRANCH" "$APT_REPO_REMOTE" "$work/checkout"
          shopt -s dotglob nullglob
          for path in "$work/checkout"/*; do name="$(basename "$path")"; case "$name" in .git|README.md) continue ;; esac; rm -rf "$path"; done
          shopt -u dotglob nullglob
          cp -r "$work/apt/dists" "$work/checkout/dists"; cp -r "$work/apt/pool" "$work/checkout/pool"
          if [ -f dist/apt/key.gpg.asc ]; then cp dist/apt/key.gpg.asc "$work/checkout/key.gpg.asc"; fi
          cd "$work/checkout"
          git -c user.name='release bot' -c user.email='release-bot@localhost' add -A
          if git diff --cached --quiet; then echo 'apt: no changes'; exit 0; fi
          git -c user.name='release bot' -c user.email='release-bot@localhost' commit -m "apt: publish ${VERSION}"
          git push --force-with-lease origin "HEAD:refs/heads/${APT_REPO_BRANCH}"
          SCRIPT
      - name: Announce stable release
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
          MATRIX_TOKEN: ${{ secrets.MATRIX_TOKEN }}
          MATRIX_HOMESERVER: ${{ secrets.MATRIX_HOMESERVER }}
          MATRIX_ROOM: ${{ secrets.MATRIX_ROOM }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping announcements."; exit 0; fi
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          release_url="$(jq -r '.html_url // .url // empty' release.json 2>/dev/null || true)"
          if [ -z "$release_url" ]; then release_url="https://codeberg.org/caniko/rs-modde/releases/tag/${VERSION}"; fi
          body="release ${VERSION} is out: ${release_url}"
          if [ -n "${MASTODON_TOKEN:-}" ] && [ -n "${MASTODON_BASE_URL:-}" ]; then
            jq -n --arg status "$body" '{status: $status}' > mastodon-status.json
            curl -sS --fail -H "Authorization: Bearer ${MASTODON_TOKEN}" -H 'Content-Type: application/json' -d @mastodon-status.json "${MASTODON_BASE_URL%/}/api/v1/statuses" > /dev/null
          else echo 'Mastodon secrets unset; skipping.'; fi
          if [ -n "${MATRIX_TOKEN:-}" ] && [ -n "${MATRIX_HOMESERVER:-}" ] && [ -n "${MATRIX_ROOM:-}" ]; then
            txnid="release-${VERSION}-${CODEBERG_RUN_ID:-manual}"
            encoded_room="$(jq -rn --arg v "$MATRIX_ROOM" '$v|@uri')"
            jq -n --arg body "$body" '{msgtype: "m.text", body: $body}' > matrix-message.json
            curl -sS --fail -X PUT -H "Authorization: Bearer ${MATRIX_TOKEN}" -H 'Content-Type: application/json' -d @matrix-message.json "${MATRIX_HOMESERVER%/}/_matrix/client/r0/rooms/${encoded_room}/send/m.room.message/${txnid}" > /dev/null
          else echo 'Matrix secrets unset; skipping.'; fi
          SCRIPT
      - name: Publish AUR packages
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping AUR packages."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            if [ "$state" = active-required ]; then echo "::error::${channel}: ${message}" >&2; exit 1; fi
            echo "::warning::${channel}: ${message}; bootstrap channel is inactive, skipping." >&2
            exit 0
          }
          if [ -z "${AUR_SSH_KEY:-}" ]; then publisher_missing aur 'AUR_SSH_KEY unset'; fi
          nix shell nixpkgs#git nixpkgs#openssh nixpkgs#pacman nixpkgs#shadow nixpkgs#util-linux -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          AUR_HOST='aur.archlinux.org'; AUR_SSH="$HOME/.ssh/aur"
          MAKEPKG_CONF="$(dirname "$(dirname "$(command -v makepkg)")")/etc/makepkg.conf"; test -r "$MAKEPKG_CONF"
          print_srcinfo() {
            pkgdir="$1"
            if [ "$(id -u)" -eq 0 ]; then
              owner_uid="$(id -u)"; owner_gid="$(id -g)"
              if ! id -u aurbuild >/dev/null 2>&1; then useradd -m -r -s /bin/sh aurbuild; fi
              chown -R aurbuild:aurbuild "$pkgdir"
              runuser -u aurbuild -- sh -c 'cd "$1" && makepkg --config "$2" --printsrcinfo > .SRCINFO' sh "$pkgdir" "$MAKEPKG_CONF"
              chown -R "$owner_uid:$owner_gid" "$pkgdir"
            else
              (cd "$pkgdir" && makepkg --config "$MAKEPKG_CONF" --printsrcinfo > .SRCINFO)
            fi
          }
          checksum_for() { awk -v a="$1" '$2 == a { print $1 }' release/SHA256SUMS.txt; }
          source_sha="$(checksum_for "rs-modde-${VERSION}.tar.gz")"
          bin_sha="$(checksum_for "modde-${VERSION}-x86_64-linux.tar.gz")"; test -n "$bin_sha"
          test -n "$source_sha"
          install -d -m 700 "$HOME/.ssh"; printf '%s\n' "$AUR_SSH_KEY" > "$AUR_SSH"; chmod 600 "$AUR_SSH"
          ssh-keyscan "$AUR_HOST" >> "$HOME/.ssh/known_hosts"; chmod 600 "$HOME/.ssh/known_hosts"
          export GIT_SSH_COMMAND="ssh -i $AUR_SSH -o IdentitiesOnly=yes"
          publish_pkg() {
            pkg="$1"
            repo="ssh://aur@aur.archlinux.org/${pkg}.git"
            rm -rf "aur-${pkg}"
            if ! git clone "$repo" "aur-${pkg}"; then mkdir "aur-${pkg}"; git -C "aur-${pkg}" init; git -C "aur-${pkg}" remote add origin "$repo"; fi
            git -C "aur-${pkg}" checkout -B master
            cp "dist/aur/${pkg}/PKGBUILD" "aur-${pkg}/PKGBUILD"
            case "$pkg" in
              modde)
                sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e 's/^pkgrel=.*/pkgrel=1/' "aur-${pkg}/PKGBUILD"
                awk -v sha="$source_sha" '/^sha256sums=/{print "sha256sums=(\047" sha "\047)"; next} {print}' "aur-${pkg}/PKGBUILD" > "aur-${pkg}/PKGBUILD.new"; mv "aur-${pkg}/PKGBUILD.new" "aur-${pkg}/PKGBUILD" ;;
              modde-bin)
                sed -i -e "s/^pkgver=.*/pkgver=${VERSION}/" -e 's/^pkgrel=.*/pkgrel=1/' "aur-${pkg}/PKGBUILD"
                awk -v b="$bin_sha" -v s="$source_sha" '/^sha256sums=/{print "sha256sums=(\047" b "\047"; print "            \047" s "\047)"; skip=1; next} skip && /^[[:space:]]*\047/{next} {skip=0; print}' "aur-${pkg}/PKGBUILD" > "aur-${pkg}/PKGBUILD.new"; mv "aur-${pkg}/PKGBUILD.new" "aur-${pkg}/PKGBUILD" ;;
              modde-git) ;;
              *) echo "unknown AUR package: $pkg" >&2; exit 1 ;;
            esac
            print_srcinfo "aur-${pkg}"
            git -C "aur-${pkg}" add PKGBUILD .SRCINFO
            if git -C "aur-${pkg}" diff --cached --quiet; then echo "AUR ${pkg} already at ${VERSION}"; return 0; fi
            git -C "aur-${pkg}" -c user.email='ci@localhost' -c user.name='release bot' commit -m "${VERSION}"
            git -C "aur-${pkg}" push origin HEAD:master
          }
          for pkg in modde modde-bin modde-git; do publish_pkg "$pkg"; done
          SCRIPT
      - name: Publish Flathub update PR
        env:
          FLATHUB_TOKEN: ${{ secrets.FLATHUB_TOKEN }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Flathub update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            if [ "$state" = active-required ]; then echo "::error::${channel}: ${message}" >&2; exit 1; fi
            echo "::warning::${channel}: ${message}; bootstrap channel is inactive, skipping." >&2
            exit 0
          }
          if [ -z "${FLATHUB_TOKEN:-}" ]; then publisher_missing flathub 'FLATHUB_TOKEN unset'; fi
          test -s release/com.tartanoglu.modde.json || publisher_missing flathub 'missing release/com.tartanoglu.modde.json'
          test -s release/cargo-sources.json || publisher_missing flathub 'missing release/cargo-sources.json'
          nix shell nixpkgs#curl nixpkgs#git nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          credential_helper='!f() { echo username=x-access-token; echo "password=$FLATHUB_TOKEN"; }; f'
          rm -rf flathub-repo; git -c credential.helper="$credential_helper" clone https://github.com/flathub/com.tartanoglu.modde.git flathub-repo
          cd flathub-repo
          git config credential.helper "$credential_helper"; git config user.email 'ci@localhost'; git config user.name 'release bot'
          git checkout -B "release/${VERSION}"
          cp ../release/com.tartanoglu.modde.json ../release/cargo-sources.json .
          if [ -z "$(git status --porcelain -- com.tartanoglu.modde.json cargo-sources.json)" ]; then echo 'manifest unchanged'; exit 0; fi
          git add com.tartanoglu.modde.json cargo-sources.json; git commit -m "${VERSION}"; git push --force-with-lease origin "release/${VERSION}"
          payload="$(jq -n --arg title "${VERSION}" --arg head "release/${VERSION}" --arg base "master" --arg body "Update to ${VERSION}." '{title: $title, head: $head, base: $base, body: $body}')"
          status="$(curl -sS -o pr.json -w '%{http_code}' -H "Authorization: Bearer ${FLATHUB_TOKEN}" -H 'Accept: application/vnd.github+json' -d "$payload" https://api.github.com/repos/flathub/com.tartanoglu.modde/pulls)"
          if [ "$status" -eq 422 ]; then echo 'PR exists or rejected'; jq -r '.message' pr.json; exit 0; fi
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat pr.json; exit 1; fi
          jq -r '.html_url' pr.json
          SCRIPT
