            --binary modde-ui \
            --tap "$PWD/tap"
          cd tap
          if [ -z "$(git status --porcelain -- Formula/modde.rb)" ]; then echo 'tap unchanged'; exit 0; fi
          git add Formula/modde.rb; git commit -m "modde ${VERSION}"; git push origin "HEAD:${DEFAULT_BRANCH}"
      - name: Publish Scoop bucket
        env:
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          SCOOP_BUCKET_URL: https://codeberg.org/caniko/scoop-modde.git
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Scoop bucket update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            if [ "$state" = active-required ]; then echo "::error::${channel}: ${message}" >&2; exit 1; fi
            echo "::warning::${channel}: ${message}; bootstrap channel is inactive, skipping." >&2
            exit 0
          }
          if [ -z "${SCOOP_BUCKET_TOKEN:-}" ]; then publisher_missing scoop 'SCOOP_BUCKET_TOKEN unset'; fi
          ZIP_NAME="modde-${VERSION}-x86_64-windows.zip"; test -s "release/${ZIP_NAME}" || publisher_missing scoop "missing release/${ZIP_NAME}"; test -s dist/scoop/modde.json || publisher_missing scoop 'missing dist/scoop/modde.json'
          SHA256="$(awk -v a="$ZIP_NAME" '$2 == a { print $1 }' release/SHA256SUMS.txt)"; test -n "$SHA256"
          credential_helper='!f() { echo username=x-access-token; echo "password=$SCOOP_BUCKET_TOKEN"; }; f'
          rm -rf scoop-bucket; git -c credential.helper="$credential_helper" clone "$SCOOP_BUCKET_URL" scoop-bucket
          cd scoop-bucket; git config credential.helper "$credential_helper"; git config user.email 'ci@localhost'; git config user.name 'release bot'
          git remote set-head origin -a; DEFAULT_BRANCH="$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's|^origin/||')"; git checkout "$DEFAULT_BRANCH"; mkdir -p bucket; cd ..
          sed -e "s|{{VERSION}}|${VERSION}|g" -e "s|{{SHA256}}|${SHA256}|g" dist/scoop/modde.json > scoop-bucket/bucket/modde.json
          cd scoop-bucket; if [ -z "$(git status --porcelain -- bucket/modde.json)" ]; then echo 'bucket unchanged'; exit 0; fi
          git add bucket/modde.json; git commit -m "modde ${VERSION}"; git push origin "HEAD:${DEFAULT_BRANCH}"
      - name: Push SRPM to COPR
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ vars.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
        run: |
          set -euo pipefail
          . ./release-env
          COPR_PROJECT="caniko/rs-modde"
          if [ "$IS_PRERELEASE" = "true" ]; then COPR_PROJECT="caniko/rs-modde-testing"; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            if [ "$state" = active-required ]; then echo "::error::${channel}: ${message}" >&2; exit 1; fi
            echo "::warning::${channel}: ${message}; bootstrap channel is inactive, skipping." >&2
            exit 0
          }
          if [ -z "$COPR_LOGIN" ] || [ -z "$COPR_USERNAME" ] || [ -z "$COPR_TOKEN" ]; then publisher_missing copr 'COPR credentials unset'; fi
          srpms=(target/modde-release/root-artifacts/srpms/*.src.rpm); if [ ! -e "${srpms[0]}" ]; then publisher_missing copr 'no SRPM to publish'; fi
          mkdir -p ~/.config
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = ${COPR_LOGIN}
          username = ${COPR_USERNAME}
          token = ${COPR_TOKEN}
          copr_url = https://copr.fedorainfracloud.org
          EOF
          chmod 600 ~/.config/copr
          nix run .#copr-cli -- build --nowait "${COPR_PROJECT}" target/modde-release/root-artifacts/srpms/*.src.rpm
      - name: Publish Chocolatey package
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          CHOCO_PUSH_SOURCE: https://push.chocolatey.org/
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Chocolatey package update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            if [ "$state" = active-required ]; then echo "::error::${channel}: ${message}" >&2; exit 1; fi
            echo "::warning::${channel}: ${message}; bootstrap channel is inactive, skipping." >&2
            exit 0
          }
          if [ -z "${CHOCOLATEY_API_KEY:-}" ]; then publisher_missing chocolatey 'CHOCOLATEY_API_KEY unset'; fi
          ZIP="release/modde-${VERSION}-x86_64-windows.zip"; test -s "$ZIP" || publisher_missing chocolatey "missing $ZIP"
          nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey git+https://codeberg.org/caniko/simit -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'modde' \
            --choco-id 'modde' \
            --choco-title 'modde' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Cross-platform game mod manager' \
            --choco-project-url 'https://modde.tartanoglu.com' \
            --choco-download-repo 'caniko/rs-modde' \
            --choco-archive-pattern 'modde-{version}-{arch}-windows.zip' \
            --push \
            --push-source "$CHOCO_PUSH_SOURCE" \
            --api-key-env CHOCOLATEY_API_KEY
