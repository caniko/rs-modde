          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then echo 'HOMEBREW_TAP_TOKEN unset; skipping.'; exit 0; fi
          credential_helper='!f() { echo username=x-access-token; echo "password=$HOMEBREW_TAP_TOKEN"; }; f'
