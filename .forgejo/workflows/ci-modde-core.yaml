# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check flake
        run: nix flake check

      - name: Test
        run: nix develop -c cargo test -p modde-core

      - name: Install cargo-deny
        run: nix develop -c cargo install cargo-deny --locked --version 0.18.3

      - name: Deny dependency policy
        run: nix develop -c cargo deny check bans licenses sources

      - name: Clippy
        run: nix develop -c cargo clippy -p modde-core --all-targets -- --deny warnings

      - name: Package crate
        run: nix develop -c cargo package -p modde-core --allow-dirty
