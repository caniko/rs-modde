---
name: credential-visibility

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: atlas-nix-trusted
    env:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
      CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
      COPR_USERNAME: ${{ vars.COPR_USERNAME }}
      COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
      MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
      MODDE_APT_REPO_GPG_KEY: ${{ secrets.MODDE_APT_REPO_GPG_KEY }}
      MODDE_APT_REPO_SSH_KEY: ${{ secrets.MODDE_APT_REPO_SSH_KEY }}
      MODDE_APT_REPO_GPG_KEY_ID: ${{ vars.MODDE_APT_REPO_GPG_KEY_ID }}
      MODDE_APT_REPO_GPG_FINGERPRINT: ${{ vars.MODDE_APT_REPO_GPG_FINGERPRINT }}
      MODDE_APT_REPO_GPG_PUBLIC_KEY: ${{ vars.MODDE_APT_REPO_GPG_PUBLIC_KEY }}
    steps:
      - name: Probe credential visibility
        run: |
          set -euo pipefail
          missing=0
          probe() {
            scope="$1"; name="$2"; value="$3"
            if [ -n "$value" ]; then
              printf '%s %s: visible\n' "$scope" "$name"
            else
              printf '%s %s: missing\n' "$scope" "$name"
              missing=1
            fi
          }

          probe 'global/user secret' CODEBERG_TOKEN "${CODEBERG_TOKEN:-}"
          probe 'global/user secret' CRATES_IO_API_TOKEN "${CRATES_IO_API_TOKEN:-}"
          probe 'global/user secret' AUR_SSH_KEY "${AUR_SSH_KEY:-}"
          probe 'global/user secret' COPR_LOGIN "${COPR_LOGIN:-}"
          probe 'global/user variable' COPR_USERNAME "${COPR_USERNAME:-}"
          probe 'global/user secret' COPR_TOKEN "${COPR_TOKEN:-}"
          probe 'global/user secret' CHOCOLATEY_API_KEY "${CHOCOLATEY_API_KEY:-}"
          probe 'repo secret' MINISIGN_SECRET_KEY "${MINISIGN_SECRET_KEY:-}"
          probe 'repo secret' MINISIGN_PASSWORD "${MINISIGN_PASSWORD:-}"
          probe 'repo secret' MODDE_APT_REPO_GPG_KEY "${MODDE_APT_REPO_GPG_KEY:-}"
          probe 'repo secret' MODDE_APT_REPO_SSH_KEY "${MODDE_APT_REPO_SSH_KEY:-}"
          probe 'repo variable' MODDE_APT_REPO_GPG_KEY_ID "${MODDE_APT_REPO_GPG_KEY_ID:-}"
          probe 'repo variable' MODDE_APT_REPO_GPG_FINGERPRINT "${MODDE_APT_REPO_GPG_FINGERPRINT:-}"
          probe 'repo variable' MODDE_APT_REPO_GPG_PUBLIC_KEY "${MODDE_APT_REPO_GPG_PUBLIC_KEY:-}"

          exit "$missing"
