---
name: debug-ci

'on':
  push:
    branches: ["debug-ci"]
  workflow_dispatch:

jobs:
  shell-basics:
    runs-on: atlas-nix-trusted
    steps:
      - run: echo "==== SHELL STEP ===="
      - run: id
      - run: echo "HOME=$HOME PWD=$PWD"
      - run: ls -la /workspace || echo "/workspace not found"
      - run: echo "==== NODE CHECK ===="
      - run: which node || echo "node not in PATH"
      - run: node --version || echo "node not executable"
      - run: echo "==== NET CHECK ===="
      - run: curl -sI https://code.forgejo.org 2>&1 | head -5 || echo "code.forgejo.org unreachable"
      - run: curl -sI https://codeberg.org 2>&1 | head -5 || echo "codeberg unreachable"

  nix-eval-basic:
    runs-on: atlas-nix-trusted
    steps:
      - run: nix --version
      - run: nix eval --expr '1+1'
      - run: echo "NIX_REMOTE=$NIX_REMOTE"
      - run: nix store ping
      - run: nix registry list | head -10 || echo "no registry"
      - run: nix eval nixpkgs#hello.name 2>&1 || echo "FAILED: nixpkgs resolution"

  nix-no-daemon:
    runs-on: atlas
    steps:
      - run: nix --version
      - run: nix eval --expr '1+1'
      - run: echo "NIX_REMOTE=$NIX_REMOTE"

  uses-only:
    runs-on: atlas-nix-trusted
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

  uses-then-run:
    runs-on: atlas-nix-trusted
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: ls -la
      - run: nix --version
