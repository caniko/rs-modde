---
name: debug-ci

'on':
  push:
    branches: ["debug-ci"]
  workflow_dispatch:

jobs:
  shell-basics:
    runs-on: atlas-nix-trusted
    steps:
      - run: echo "==== SHELL STEP ===="
      - run: id
      - run: echo "HOME=$HOME PWD=$PWD"
      - run: ls -la /workspace || echo "/workspace not found"
      - run: echo "==== NODE CHECK ===="
      - run: which node || echo "node not in PATH"
      - run: node --version || echo "node not executable"
      - run: echo "==== NET CHECK ===="
      - run: curl -sI https://code.forgejo.org 2>&1 | head -5 || echo "code.forgejo.org unreachable"
      - run: curl -sI https://codeberg.org 2>&1 | head -5 || echo "codeberg unreachable"

  nix-access:
    runs-on: atlas-nix-trusted
    steps:
      - run: |
          echo "=== nix step 1 ===" && nix --version && echo "=== nix step 1 OK ==="
      - run: |
          echo "=== nix step 2 ===" && nix eval nixpkgs#hello.name && echo "=== nix step 2 OK ==="
      - run: echo "NIX_REMOTE=$NIX_REMOTE"
      - run: |
          echo "=== nix step 4 ===" && nix store ping && echo "=== nix step 4 OK ==="

  nix-version-only:
    runs-on: atlas-nix-trusted
    steps:
      - run: echo "path=$PATH"
      - run: which nix
      - run: nix --version
      - run: |
          echo "=== daemon socket ==="
          ls -la /nix/var/nix/daemon-socket/socket 2>&1 || echo "socket not found at default path"
          find /nix/var/nix -name socket 2>/dev/null || echo "no socket found under /nix/var/nix"
      - run: env | grep NIX
      - run: |
          echo "=== nix store ping ==="
          nix store ping 2>&1 || echo "nix store ping failed"

  uses-only:
    runs-on: atlas-nix-trusted
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

  uses-then-run:
    runs-on: atlas-nix-trusted
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: ls -la
      - run: nix --version
