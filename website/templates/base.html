<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') }}">
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a href="{{ config.base_url }}" class="nav-brand">modde</a>
      <div class="nav-links">
        <a href="{{ config.base_url }}/#install">Install</a>
        <a href="{{ config.base_url }}/#supported-games">Supported games</a>
        <a href="{{ config.base_url }}/docs/">Documentation</a>
        <a href="{{ config.base_url }}/comparison/">vs MO2</a>
        <a href="https://codeberg.org/caniko/rs-modde">Source</a>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>modde is open-source software licensed under GPL-3.0.</p>
      <div class="footer-links">
        <a href="https://modde.tartanoglu.com/docs/">Docs</a>
        <a href="https://codeberg.org/caniko/rs-modde">Repo</a>
        <a href="https://codeberg.org/caniko/rs-modde/src/branch/trunk/CHANGELOG.md">CHANGELOG</a>
        <a href="https://codeberg.org/caniko/rs-modde/issues">Issues</a>
      </div>
    </div>
  </footer>
</body>
</html>
