[package]
name = "modde-cli"
version.workspace = true
description = "CLI interface for modde"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"
documentation = "https://docs.rs/modde-cli"
include = [
  "../../LICENSE",
  "../../README.md",
  "CHANGELOG.md",
  "Cargo.toml",
  "src/**",
  "tests/**",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[package.metadata.release]
pre-release-replacements = [
  { file = "../../modde.spec", search = "^Version:\\s+.*$", replace = "Version:        {{version}}", exactly = 1 },
]

[package.metadata.deb]
name = "modde"
maintainer = "Can H. Tartanoglu <caniko@codeberg.org>"
depends = "libc6, libgcc-s1, libssl3, libdbus-1-3, libsqlite3-0"
section = "utils"
priority = "optional"
assets = [
  [
    "../../target/release/modde",
    "usr/bin/",
    "755",
  ],
  [
    "../../LICENSE",
    "usr/share/doc/modde/copyright",
    "644",
  ],
  [
    "../../README.md",
    "usr/share/doc/modde/README.md",
    "644",
  ],
]

[features]
default = ["rar", "linux-integrations", "macos-integrations"]
rar = ["modde-sources/rar"]
linux-integrations = [
  "modde-core/linux-integrations",
  "modde-games/linux-integrations",
  "modde-sources/linux-integrations",
  "modde-ui/linux-integrations",
]
macos-integrations = [
  "modde-core/macos-integrations",
  "modde-games/macos-integrations",
  "modde-sources/macos-integrations",
  "modde-ui/macos-integrations",
]
windows-integrations = [
  "modde-core/windows-integrations",
  "modde-games/windows-integrations",
  "modde-sources/windows-integrations",
  "modde-ui/windows-integrations",
]
heap-profile = []
# Hidden `modde dev screenshot` command for headless GUI asset capture.
# Non-default; enables the modde-ui headless screenshot backend.
screenshot = ["modde-ui/screenshot"]
remote-telemetry = [
  "dep:detritus",
  "dep:detritus-protocol",
  "dep:dirs",
  "dep:modde-oracle-api",
  "dep:secrecy",
  "dep:sha2",
  "dep:uuid",
]

[[bin]]
name = "modde"
path = "src/main.rs"

[dependencies]
modde-core = { workspace = true }
modde-sources = { workspace = true }
modde-games = { workspace = true }
modde-ui = { workspace = true }
modde-oracle-api = { workspace = true, optional = true }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
detritus = { workspace = true, optional = true }
detritus-protocol = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
serde_json = { workspace = true }
toml = { workspace = true }
reqwest = { workspace = true }
xxhash-rust = { workspace = true }
fomod-oxide = { workspace = true }
serde = { workspace = true }
smallvec = { workspace = true }
zip = { workspace = true }
url = { workspace = true }
notify = { workspace = true }
open = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
assert_cmd = { workspace = true }
insta = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true }
